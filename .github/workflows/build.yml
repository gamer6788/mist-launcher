name: Build and Publish MIST

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MIST
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set MIST version
        shell: bash
        run: |
          echo "MIST_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "MIST_VERSION_NAME=1.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restore MIST signing key
        env:
          MIST_KEYSTORE_BASE64: ${{ secrets.MIST_KEYSTORE_BASE64 }}
        run: |
          test -n "$MIST_KEYSTORE_BASE64"
          mkdir -p app
          printf '%s' "$MIST_KEYSTORE_BASE64" | base64 --decode > app/mist-release.jks
          test -s app/mist-release.jks

      - name: Build signed APK
        env:
          MIST_KEYSTORE_PATH: mist-release.jks
          MIST_KEYSTORE_PASSWORD: ${{ secrets.MIST_KEYSTORE_PASSWORD }}
          MIST_KEY_ALIAS: ${{ secrets.MIST_KEY_ALIAS }}
          MIST_KEY_PASSWORD: ${{ secrets.MIST_KEY_PASSWORD }}
        run: |
          gradle clean assembleRelease --no-daemon -Pkotlin.incremental=false

      - name: Prepare APK and calculate SHA256
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          cp "$APK" mist.apk

          SHA256=$(sha256sum mist.apk | awk '{print $1}')
          echo "MIST_SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${MIST_VERSION_NAME}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating existing release"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MIST ${MIST_VERSION_NAME}" \
              --notes "Automatic MIST update release."
          fi

          gh release upload "$TAG" mist.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Generate update manifest
        run: |
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${MIST_VERSION_NAME}/mist.apk"

          jq -n \
            --argjson versionCode "$MIST_VERSION_CODE" \
            --arg versionName "$MIST_VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$MIST_SHA256" \
            --arg releaseNotes "Automatic MIST update release." \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              sha256: $sha256,
              releaseNotes: $releaseNotes
            }' > latest.json

      - name: Publish update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json

          if ! git diff --cached --quiet; then
            git commit -m "Update MIST update manifest"
            git push origin HEAD:main
          fi

      - name: Clean signing key
        if: always()
        run: |
          rm -f app/mist-release.jks
